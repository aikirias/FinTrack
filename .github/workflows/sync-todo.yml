name: Sync TODO from GitHub Issues

on:
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: sync-todo-${{ github.repository }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate the one-line issue index
        env:
          GH_TOKEN: ${{ github.token }}
          TODO_FILE: TODO.md
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          output = os.environ["TODO_FILE"]
          issues = []
          page = 1

          while True:
              query = urllib.parse.urlencode({
                  "state": "open",
                  "per_page": 100,
                  "page": page,
                  "sort": "created",
                  "direction": "asc",
              })
              request = urllib.request.Request(
                  f"{api}/repos/{repo}/issues?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  batch = json.load(response)
              issues.extend(issue for issue in batch if "pull_request" not in issue)
              if len(batch) < 100:
                  break
              page += 1

          def escape_markdown(value):
              return value.replace("\\", "\\\\").replace("[", "\\[").replace("]", "\\]")

          lines = [
              "# TODO",
              "",
              "Generated automatically from open GitHub Issues. Do not edit this file manually.",
              "The issue body is the source of truth for scope, context, and acceptance criteria.",
              "",
          ]
          if issues:
              for issue in sorted(issues, key=lambda item: item["number"]):
                  title = escape_markdown(issue["title"].replace("\n", " ").strip())
                  lines.append(f'- [#{issue["number"]} — {title}]({issue["html_url"]})')
          else:
              lines.append("No open issues.")

          with open(output, "w", encoding="utf-8", newline="\n") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Commit changes
        env:
          TODO_FILE: TODO.md
        run: |
          if git diff --quiet -- "$TODO_FILE"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TODO_FILE"
          git commit -m "docs: sync TODO from open issues"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
